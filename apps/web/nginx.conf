# nginx in front of everything: serves the web page and splits /api between the two API copies.
# The browser sees one address (localhost:8080), so there's no CORS.
#
# A full config file, because the connection limit can only be set here.
# Files go in /tmp because nginx runs as a normal user and can only write there.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
  # Connections per nginx process. Each request uses two (browser to nginx, nginx to API).
  # The default 1024 ran out in the greedy stress test.
  worker_connections 8192;
}

http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # $upstream_addr: which API copy answered.
  log_format main '$remote_addr "$request" $status $request_time s upstream=$upstream_addr';
  access_log /var/log/nginx/access.log main;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off; # no nginx version in error pages and headers

  upstream api {
    # One line per API copy. Requests take turns (round robin).
    # A failed request is retried on the other line. With one name for both, there was no retry.
    #
    # Names are looked up once, at start. With "resolve" (look up again every few seconds),
    # a stopped copy vanished mid-request and nginx wouldn't retry (504s).
    # Downside: if a copy restarts at a new address, run `docker compose restart nginx`.
    #
    # max_fails=3 fail_timeout=10s: after 3 failed connections, skip that copy for 10 s.
    # Not 1: under a burst one slow connection is normal, and 1 knocked out both copies (502s).
    server api1:3000 max_fails=3 fail_timeout=10s;
    server api2:3000 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 8080;

    location /api/ {
      proxy_pass http://api;
      # Replace, never add to: the API trusts this header, so a client can't fake its IP.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;

      # If a copy is down, nginx tries the other one. For a POST it only retries if the request
      # was never sent, so a purchase is never sent twice.
      # 3 s: enough time for one retried connection (the system retries after 1 s).
      # No keep-alive to the API, so a copy shutting down never gets a request on an old connection.
      proxy_connect_timeout 3s;
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
    }

    # To check the whole system from outside.
    location = /health {
      proxy_pass http://api;
    }

    location / {
      root /usr/share/nginx/html;
      # Single-page app: any other path gets index.html.
      try_files $uri /index.html;
    }

    # Vite puts a hash in each file name, so changed files get new names. Safe to cache long.
    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}

# nginx in front of everything (requirement 07): serves the React build and load-balances the API.
# The browser sees one origin (http://localhost:8080), so the web app calls /api on the same origin
# and CORS never comes into play.
#
# A full main config, replacing the image's /etc/nginx/nginx.conf, because the connection limit
# (events) can only be set here. The /tmp paths and the pid file follow the nginx-unprivileged
# image: a non-root user can only write there.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
  # Connections per worker process. Each proxied request holds two (browser to nginx, nginx to
  # API). The image's 1024 ran out during the greedy stress test, and nginx started closing
  # clients' connections.
  worker_connections 8192;
}

http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # $upstream_addr: which API replica answered (an address; `docker compose logs api` has names).
  log_format main '$remote_addr "$request" $status $request_time s upstream=$upstream_addr';
  access_log /var/log/nginx/access.log main;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off; # no nginx version in error pages and headers

  upstream api {
    # One line per API replica, sent requests in turn (round robin). A failed request moves on to
    # a different server line, so each replica needs its own line: with one name for both, nginx
    # gave up after the first try and the failover test got 504s.
    #
    # The names are looked up once, when nginx starts, so this list never changes. That is on
    # purpose. With "resolve" (a lookup every few seconds) a stopped replica vanished from the
    # list while requests to it were still waiting, and nginx then refused to retry them (504s).
    # The cost: if a restarted replica comes back at a new address, nginx keeps trying the old
    # one (3 s, then the other replica) until `docker compose restart nginx`.
    #
    # max_fails=3 fail_timeout=10s: after 3 failed connections within 10 s, skip that replica for
    # 10 s, then try it again. A stopped replica stops costing a 3 s wait almost at once. Not 1:
    # under a burst one slow connect is normal, and with max_fails=1 (and a 1 s connect timeout)
    # the greedy test knocked out both replicas and got thousands of 502s.
    server api1:3000 max_fails=3 fail_timeout=10s;
    server api2:3000 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 8080;

    location /api/ {
      proxy_pass http://api;
      # Overwrite, never append: the API trusts this header from nginx (TRUST_PROXY), so a value
      # sent by the client must not survive. $remote_addr is the address nginx actually sees.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;

      # A replica that is stopping or gone refuses the connection or never answers it. nginx then
      # tries the other replica. For a POST it only does that when the request was never sent, so
      # a purchase is never sent twice. 3 s leaves room for one lost connection attempt, which the
      # kernel repeats after 1 s. No keep-alive to the API (nginx's default), so a replica that is
      # shutting down never gets a new request on an old connection.
      proxy_connect_timeout 3s;
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
    }

    # For checking the whole chain from outside. Docker's own healthchecks call each replica.
    location = /health {
      proxy_pass http://api;
    }

    location / {
      root /usr/share/nginx/html;
      # One-page app: any other path gets index.html.
      try_files $uri /index.html;
    }

    # Vite puts a content hash in every asset file name, so a changed file gets a new name.
    # That makes long browser caching safe.
    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}

# The whole system: `docker compose up --build`, then http://localhost:8080.
# Stands in for cloud services (Redis = ElastiCache, Postgres = RDS, nginx = load balancer).
# Only nginx is reachable from outside. docker-compose.override.yml opens Redis and Postgres
# for development. docker-compose.stress.yml adds stress test settings.

services:
  redis:
    image: redis:7.4-alpine
    # AOF saves every write to disk, so stock and buyers survive a Redis restart.
    # everysec: saves once a second. We could lose 1 s of writes, but it's much faster.
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs once: creates the database tables, then exits. The API and worker wait for it.
  migrate:
    build: { context: ., target: migrate }
    environment:
      # A password with @ : / or # would break this URL.
      DATABASE_URL: &database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    restart: 'no'

  # Two API copies behind nginx: api1 and api2, from one definition (&api).
  # They only share Redis and Postgres (rule 7), so the stress tests prove the rules
  # hold across copies.
  #
  # Why two services instead of `replicas: 2`: nginx only retries on a different server name.
  # With one name, stopping a copy gave 504s. With two names, nginx retries on the other.
  api1: &api
    build: { context: ., target: api }
    # Each setting listed, so the container gets only what it needs.
    # Inside Docker, Redis and Postgres are reached by service name, not localhost.
    environment:
      REDIS_URL: &redis-url redis://redis:6379
      DATABASE_URL: *database-url
      PORT: 3000
      SALE_STARTS_AT: ${SALE_STARTS_AT:?set in .env}
      SALE_ENDS_AT: ${SALE_ENDS_AT:?set in .env}
      SALE_STOCK: ${SALE_STOCK:?set in .env}
      PRODUCT_NAME: ${PRODUCT_NAME:?set in .env}
      PRODUCT_PRICE: ${PRODUCT_PRICE:?set in .env}
      PRODUCT_IMAGE_URL: ${PRODUCT_IMAGE_URL:-}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      # The page and API are both on nginx's address. Only it may call the API from a browser.
      WEB_ORIGIN: http://localhost:8080
      RATE_LIMIT_USER_PER_SEC: ${RATE_LIMIT_USER_PER_SEC:-5}
      RATE_LIMIT_IP_PER_SEC: ${RATE_LIMIT_IP_PER_SEC:-50}
      # Trust the client IP header only from Docker's private addresses (nginx).
      TRUST_PROXY: uniquelocal
      # One log line per request, so `docker compose logs api1 api2` shows both working.
      LOG_REQUESTS: 'true'
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    # /health gives 503 if Redis or Postgres is down, so Docker marks this copy unhealthy.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api2: *api

  worker:
    build: { context: ., target: worker }
    environment:
      REDIS_URL: *redis-url
      DATABASE_URL: *database-url
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    restart: unless-stopped

  # The only open port: page and API, on this machine only.
  nginx:
    build: { context: ., target: web }
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api1: { condition: service_healthy }
      api2: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  internal:

volumes:
  redis-data:
  postgres-data:

# Local stand-in for managed cloud services (Redis = ElastiCache, Postgres = RDS).
# No ports are published here: data stores are reachable only on the internal network.
# docker-compose.override.yml opens them to localhost for development only.

services:
  redis:
    image: redis:7.4-alpine
    # AOF logs every write, so stock and buyers survive a Redis restart.
    # everysec trades at most one second of writes for much higher throughput than fsync always.
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  internal:

volumes:
  redis-data:
  postgres-data:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flash sale on mobile, confirming</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;background:#F6F8FC;color:#0B192D}
a{color:#095AE9}a:hover{color:#0848C0}
button{font-family:inherit}
@keyframes fs-spin{to{transform:rotate(360deg)}}
.fs-spin{animation:fs-spin .8s linear infinite}
@media (prefers-reduced-motion: reduce){.fs-spin{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F8FC; display: flex; flex-direction: column;">
  <header style="height: 60px; box-sizing: border-box; padding: 0 20px; background: #07112A; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #095AE9; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
      </div>
      <span style="font-size: 18px; font-weight: 800; color: #FCFCFC;">Flash Sale</span>
    </div>
    <button type="button" style="height: 44px; padding: 0 14px; border-radius: 100px; border: 1px solid #3A4560; background: transparent; color: #FCFCFC; font-size: 14px; font-weight: 600;">Sign out</button>
  </header>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; gap: 14px; align-items: center; background: #FFFFFF; border: 1px solid #D1DAE5; border-radius: 14px; padding: 14px;">
      <div style="width: 84px; height: 84px; border-radius: 10px; background: #EEF3FD; border: 1px dashed #9DB8F2; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #4A6CB3; text-align: center;">[Image]</div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #095AE9;">Limited edition</span>
        <span style="font-size: 20px; font-weight: 800;">[Product name]</span>
        <span style="font-size: 16px; font-weight: 700;">[Price] <span style="font-size: 13px; font-weight: 500; color: #5B6573;">· 1 per person</span></span>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #D1DAE5; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
      <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 100px; font-size: 13px; font-weight: 700; background: #FFF4DB; color: #6B4200;"><span style="width: 8px; height: 8px; border-radius: 100px; background: #FFAE10;"></span>Live now</span>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 14px; font-weight: 600; color: #5B6573;">Ends in</span>
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 42px; font-weight: 600; letter-spacing: -0.02em;">00:27:10</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; font-size: 14px;">
          <span style="font-weight: 600;">41 of 100 left</span>
          <span style="color: #5B6573;">Selling fast</span>
        </div>
        <div style="height: 8px; border-radius: 100px; background: #E6ECF5;"><div style="height: 8px; width: 41%; border-radius: 100px; background: #095AE9;"></div></div>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #D1DAE5; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
      <span style="font-size: 14px; color: #5B6573;">Signed in as <strong style="color: #0B192D;">eli@example.com</strong></span>
      <button type="button" disabled="disabled" style="height: 56px; border-radius: 100px; border: none; font-size: 18px; font-weight: 800; background: #EAF1FE; color: #0848C0;">Purchased</button>
      <div aria-live="polite" style="border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; background: #EAF1FE; border: 1px solid #095AE9;">
        <span style="margin-top: 5px; width: 10px; height: 10px; border-radius: 100px; flex-shrink: 0; background: #095AE9;"></span>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 16px; font-weight: 800; color: #0848C0;">You got one!</span>
          <span style="font-size: 14px; color: #33404F; line-height: 1.45;">Your unit is reserved. Confirmation takes a few seconds.</span>
        </div>
      </div>
      <div aria-live="polite" style="display: flex; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid #E6ECF5;">
        <span class="fs-spin" aria-hidden="true" style="width: 16px; height: 16px; flex-shrink: 0; box-sizing: border-box; border-radius: 100px; border: 2.5px solid #D6E2FB; border-top-color: #095AE9;"></span>
        <span style="font-size: 14px; color: #33404F;"><strong style="color: #0B192D;">Reserved.</strong> Confirming your order…</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

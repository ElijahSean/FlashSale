<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flash sale first load</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;background:#F6F8FC;color:#0B192D}
a{color:#095AE9}a:hover{color:#0848C0}
@keyframes fs-pulse{50%{opacity:.55}}
.fs-pulse{animation:fs-pulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.fs-pulse{animation:none}}
</style>
</helmet>
<div style="width: 1280px; height: 860px; box-sizing: border-box; background: #F6F8FC; display: flex; flex-direction: column;">
  <header style="height: 72px; box-sizing: border-box; padding: 0 48px; background: #07112A; display: flex; align-items: center;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 32px; height: 32px; border-radius: 10px; background: #095AE9; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
      </div>
      <span style="font-size: 20px; font-weight: 800; color: #FCFCFC;">Flash Sale</span>
    </div>
  </header>
  <main aria-busy="true" aria-label="Loading sale" style="flex-grow: 1; box-sizing: border-box; padding: 48px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px;">
    <section class="fs-pulse" style="background: #FFFFFF; border: 1px solid #D1DAE5; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 24px;">
      <div style="flex-grow: 1; min-height: 360px; border-radius: 12px; background: #E6ECF5;"></div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="width: 120px; height: 12px; border-radius: 6px; background: #E6ECF5;"></div>
        <div style="width: 320px; height: 36px; border-radius: 8px; background: #E6ECF5;"></div>
        <div style="width: 180px; height: 26px; border-radius: 8px; background: #E6ECF5;"></div>
      </div>
    </section>
    <section class="fs-pulse" style="display: flex; flex-direction: column; gap: 20px;">
      <div style="background: #FFFFFF; border: 1px solid #D1DAE5; border-radius: 16px; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px;">
        <div style="width: 110px; height: 32px; border-radius: 100px; background: #E6ECF5;"></div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="width: 70px; height: 14px; border-radius: 6px; background: #E6ECF5;"></div>
          <div style="width: 300px; height: 56px; border-radius: 10px; background: #E6ECF5;"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="width: 140px; height: 14px; border-radius: 6px; background: #E6ECF5;"></div>
          <div style="height: 10px; border-radius: 100px; background: #E6ECF5;"></div>
        </div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #D1DAE5; border-radius: 16px; padding: 28px 32px; display: flex; flex-direction: column; gap: 14px;">
        <div style="width: 150px; height: 14px; border-radius: 6px; background: #E6ECF5;"></div>
        <div style="height: 52px; border-radius: 12px; background: #E6ECF5;"></div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

# Stress test settings, added on top of docker-compose.yml by the npm stress scripts.
# Plain `docker compose up` never reads this file, so admin stays off and limits stay low.

services:
  # Opened on this machine only, so `npm run verify` can read them.
  redis:
    ports:
      - '127.0.0.1:6379:6379'
  postgres:
    ports:
      - '127.0.0.1:5432:5432'

  # Added to both API copies.
  api1: &stress-api
    environment:
      # Each k6 script resets the sale first.
      ENABLE_ADMIN: 'true'
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set in .env}
      # All k6 users share one IP. The normal limit (50/s) would just return 429s.
      # The per-user limit is raised so each greedy user's 20 requests reach Lua.
      RATE_LIMIT_IP_PER_SEC: 1000000
      RATE_LIMIT_USER_PER_SEC: 1000
  api2: *stress-api

  # The load tester. Only runs when asked. It calls nginx like a browser, so the whole
  # system is tested: nginx, both API copies, Redis, the queue and the worker.
  k6:
    image: grafana/k6:2.3.0
    profiles: [k6]
    volumes:
      - ./stress:/scripts:ro
    environment:
      BASE_URL: http://nginx:8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set in .env}
    depends_on:
      nginx: { condition: service_healthy }
    networks: [internal]
